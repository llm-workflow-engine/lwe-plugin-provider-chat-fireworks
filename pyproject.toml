[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lwe-plugin-provider-chat-fireworks"
dynamic = ["version"]
description = "LWE plugin: Chat Fireworks Provider plugin"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Chad Phillips", email = "chad@apartmentlines.com" },
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
dependencies = [
  "langchain-fireworks>=1.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-datadir",
    "pip-tools",
    "basedpyright",
    "flake8",
    "black",
]

[project.urls]
Homepage = "https://github.com/llm-workflow-engine/lwe-plugin-provider-chat-fireworks"
Repository = "https://github.com/llm-workflow-engine/lwe-plugin-provider-chat-fireworks"

[project.entry-points."lwe_plugins"]
lwe_plugin_provider_chat_fireworks = "lwe_plugin_provider_chat_fireworks.plugin:ProviderChatFireworks"

[tool.setuptools.dynamic]
version = { attr = "lwe_plugin_provider_chat_fireworks.version.__version__" }

[tool.setuptools.packages.find]
include = ["lwe_plugin_provider_chat_fireworks*"]
